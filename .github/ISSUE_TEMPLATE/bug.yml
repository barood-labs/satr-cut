name: Bug
description: A command, a lint rule, or a render that did the wrong thing
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command and the exit code. Do not paste API keys, tokens, or private story text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mock
        - comfyui
        - fal
        - replicate
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: satrcut version
      description: The output of `satrcut --version`.
    validations:
      required: true
