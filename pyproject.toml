[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satrcut"
version = "0.1.0"
description = "Production CLI for vertical 9:16 micro-drama: lint a shot plan, resume ComfyUI renders, QC every take, assemble a 1080x1920 episode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "barood-labs" }]
keywords = ["micro-drama", "comfyui", "wan", "ffmpeg", "vertical-video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
qc = ["opencv-python-headless>=4.9", "mediapipe>=0.10.14"]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
satrcut = "satrcut.cli:main"

[project.urls]
Homepage = "https://github.com/barood-labs/satr-cut"
Documentation = "https://github.com/barood-labs/satr-cut/tree/main/docs"
Issues = "https://github.com/barood-labs/satr-cut/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satrcut = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
